name: Practica4 - Hola mundo y notificacion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Ejecutar y verificar Hola mundo
        shell: bash
        run: |
          resultado="$(node hola-mundo.js)"
          printf '%s\n' "$resultado"
          test "$resultado" = "Hola mundo"

      - name: Enviar notificacion a ntfy
        shell: bash
        run: |
          mensaje="Practica4: Hola mundo. Nuevo push a main. Commit ${GITHUB_SHA:0:7}."
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --header "Content-Type: text/plain; charset=utf-8" \
            --data-binary "$mensaje" \
            --output "$RUNNER_TEMP/ntfy-response.json" \
            https://ntfy.sh/devops-itla
          node - "$RUNNER_TEMP/ntfy-response.json" "$mensaje" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const response = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          assert.equal(response.event, 'message');
          assert.equal(response.topic, 'devops-itla');
          assert.equal(response.message, process.argv[3]);
          assert.ok(response.id);
          console.log(`Notificacion aceptada por ntfy. ID: ${response.id}`);
          NODE
